# =====================================================================
# Nginx untuk Laravel — Ticket 34 (Docker demo stack)
# - Aset statis (build Vite) dilayani langsung dari /var/nginx-app/public.
# - Semua request non-aset diteruskan via FastCGI ke service "app".
# - SCRIPT_FILENAME memakai path container app (/var/www/html) — path
#   mount nginx-root diset identik dengan WORKDIR image app.
# =====================================================================

server {
    listen 80 default_server;
    server_name _;

    # Read-only copy of the app's /var/www/html (docker volume nginx-root)
    root /var/nginx-app/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 20M;

    # ---- HTTPS di belakang ngrok (tanpa percaya proxy sembarang) ----
    # Container ini hanya menerima trafik dari jaringan internal Docker
    # (ngrok/edge = satu-satunya ingress), jadi proxy header dipercaya di sini.
    # TLD + Laravel trustProxies = '*' (env TRUST_PROXIES) menangani sisanya.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;

    # ---- Blokir file sensitif (return 404, tidak 403 agar tidak mengonfirmasi keberadaan) ----
    location ~ /\.(?!well-known) { deny all; }        # .git, .env, .env.docker, dotfiles
    location ~* \.(env|sqlite|sql|dump|log|md)$ { deny all; }
    location ~ /(vendor|storage/framework|bootstrap|docker|tests)/ { deny all; }
    location = /composer.json { deny all; }
    location = /composer.lock { deny all; }
    location = /package.json { deny all; }

    # ---- Healthcheck container nginx ----
    location = /nginx-health { access_log off; return 200 "ok\n"; }

    # ---- Aset build Vite (immutable, dilayani nginx langsung) ----
    location /build/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # Aset statis umum (favicon, robots)
    location = /favicon.ico { try_files $uri =404; access_log off; expires 7d; }
    location = /robots.txt  { try_files $uri =404; access_log off; }

    # ---- Fallback Laravel: semua request non-file ke front controller ----
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ---- FastCGI ke PHP-FPM (service app:9000) ----
    location ~ \.php$ {
        try_files $uri =404; # cegah eksekusi path yang tidak ada (no source exposure)
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
        # Sampaikan host & proto asli (ngrok HTTPS) ke Laravel
        # $http_host = host + port asli (penting agar URL absolut benar di localhost:8080)
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param HTTPS $https if_not_empty;
    }

    # ---- Kebijakan keamanan dasar ----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Log ke stdout/stderr Docker
    access_log /dev/stdout main;
    error_log /dev/stderr warn;
}
