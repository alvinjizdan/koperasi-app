; =====================================================================
; PHP production overrides — KSP Bima Sakti Mandiri (Docker)
; Disematkan sebagai zz-prod.ini (muat setelah default php.ini)
; =====================================================================

[PHP]
memory_limit = 512M
max_execution_time = 120
; Production: jangan tampilkan error di output (Laravel yang menangani tampilan error)
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2 ; stderr -> docker logs

[Session]
; Driver session ditangani Laravel (database); ini hanya nilai dasar PHP
session.use_strict_mode = 1
session.cookie_httponly = 1

[opcache]
opcache.enable = 1
opcache.validate_timestamps = 0 ; production: jangan cek perubahan file
opcache.jit = tracing
opcache.jit_buffer_size = 64M
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
