# =====================================================================
# KSP Bima Sakti Mandiri — Docker Compose (demo/portofolio)
# Services: app (PHP-FPM), nginx (web+FastCGI), db (PostgreSQL),
# ngrok (tunnel HTTPS publik, profile "tunnel").
# Kredensial via .env.docker (env_file) — tidak ada hard-coded secret.
# =====================================================================

services:
  app:
    build: .
    image: ksp-bima-sakti-app
    env_file: .env.docker
    volumes:
      - app-storage:/var/www/html/storage
      # Root dokumen yang dilayani nginx; diisi oleh entrypoint app (rw di sini)
      - nginx-root:/var/nginx-app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      # Konfigurasi server (ro)
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Document root = hasil Vite build dari image app (build assets dilayani nginx)
      - nginx-root:/var/nginx-app:ro
    depends_on:
      - app
    networks:
      - internal
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    env_file: .env.docker
    environment:
      # Nilai konsumen diambil dari env_file (POSTGRES_DB/USER/PASSWORD)
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
    # Port DB TIDAK diekspos ke host/ internet (akses via jaringan internal saja)
    expose:
      - "5432"
    healthcheck:
      # $$ = env container (dari env_file), bukan interpolasi compose
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - internal
    restart: unless-stopped

  # Tunnel HTTPS publik (opsional): docker compose --profile tunnel up -d ngrok
  ngrok:
    image: ngrok/ngrok:3
    profiles: ["tunnel"]
    command: start --all --config /etc/ngrok/ngrok.yml
    # NGROK_AUTHTOKEN dibaca langsung dari env_file (tidak lewat interpolasi compose)
    env_file: .env.docker
    volumes:
      - ./docker/ngrok/ngrok.yml:/etc/ngrok/ngrok.yml:ro
    ports:
      - "127.0.0.1:4040:4040" # inspector lokal saja (tidak terlihat dari LAN)
    depends_on:
      - nginx
    networks:
      - internal
    restart: unless-stopped

volumes:
  db-data: # persistensi data PostgreSQL (named volume)
  app-storage: # persistensi storage/ Laravel (logs, cache file)
  nginx-root: # dokumen root bersama app -> nginx (ro di nginx)

networks:
  internal:
    driver: bridge
